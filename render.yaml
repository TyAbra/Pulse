services:
  - type: web
    name: pulse
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Let the service worker update without stale caching issues
      - path: /sw.js
        name: Cache-Control
        value: no-cache
